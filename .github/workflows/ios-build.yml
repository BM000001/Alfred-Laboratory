name: Alfred iOS Build

on:
  push:
    branches: [main, develop-app]
    paths:
      - "native/ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main, develop-app]
    paths:
      - "native/ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alfred-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Generate Xcode project and compile iOS app
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: native/ios
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator
        working-directory: native/ios
        run: >-
          xcodebuild
          -project Alfred.xcodeproj
          -scheme Alfred
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
