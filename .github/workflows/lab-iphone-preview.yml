name: Laboratory iPhone homologation build

on:
  push:
    branches:
      - fix/iphone-preview-main-20261108
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Codex agent profiles (when included)
        run: |
          if [ -d .codex/agents ]; then
            python3 scripts/check-agent-profiles.py
          else
            echo "No Codex agent profiles on this branch; skipping profile validation."
          fi
      - name: Smoke test Codex pilot preflight (no model call)
        run: |
          bash -n scripts/pilot-codex-agents.sh
          bash scripts/pilot-codex-agents.sh --check
          bash scripts/test-pilot-codex-agents.sh
      - name: Validate optional Codespaces agent setup (no AI calls)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('.devcontainer/agents/devcontainer.json').read_text())
          tasks = json.loads(Path('.vscode/tasks.json').read_text())
          setup = config.get('postCreateCommand', '')
          assert '@openai/codex@0.167.0' in setup
          assert 'npm install --no-audit' not in setup, 'Codespace must stay clean for the pilot'
          assert 'scripts/check-agent-profiles.py' in setup
          assert 'codex exec' not in setup and 'codex login' not in setup
          assert len(tasks['tasks']) == 3
          commands = [task['command'] for task in tasks['tasks']]
          assert commands == [
              'bash scripts/pilot-codex-agents.sh --check',
              'codex login --device-auth',
              'bash scripts/pilot-codex-agents.sh --run',
          ]
          print('Optional Codespaces config and human-gated pilot tasks validated.')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build for Laboratory Pages path
        env:
          ALFRED_PAGES_BASE: /Alfred-Laboratory/
        run: npm run build:pages
      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: alfred-laboratory-iphone-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
