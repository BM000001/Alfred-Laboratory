name: Laboratory iPhone homologation build

on:
  push:
    branches:
      - fix/iphone-preview-main-20261108
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test event-driven agent router
        run: node --test .github/scripts/alfred-agent-event-router.test.mjs
      - name: Test application
        run: npm test
      - name: Build for Laboratory Pages path
        env:
          ALFRED_PAGES_BASE: /Alfred-Laboratory/
        run: npm run build:pages
      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: alfred-laboratory-iphone-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
