name: Laboratory iPhone homologation build

on:
  push:
    branches:
      - fix/iphone-preview-main-20261108
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Codex agent profiles (when included)
        run: |
          if [ -d .codex/agents ]; then
            python3 scripts/check-agent-profiles.py
          else
            echo "No Codex agent profiles on this branch; skipping profile validation."
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build for Laboratory Pages path
        env:
          ALFRED_PAGES_BASE: /Alfred-Laboratory/
        run: npm run build:pages
      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: alfred-laboratory-iphone-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
