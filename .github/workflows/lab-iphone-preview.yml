name: Laboratory iPhone homologation build

on:
  push:
    branches:
      - feat/iphone-homologation-pipeline
  pull_request:
    branches:
      - develop-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build for isolated Laboratory path
        run: npm run build:lab
      - name: Upload build for inspection (not a public deployment)
        uses: actions/upload-artifact@v4
        with:
          name: alfred-laboratory-iphone-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
