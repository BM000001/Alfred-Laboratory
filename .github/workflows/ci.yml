name: Alfred CI

on:
  push:
    branches: [main, develop-app]
  pull_request:
    branches: [main, develop-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Install, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Report dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            try {
              const report = JSON.parse(readFileSync("npm-audit.json", "utf8"));
              console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
              for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
                console.log(`${item.severity}: ${name}; affected=${item.range}; fix=${JSON.stringify(item.fixAvailable)}`);
              }
            } catch {
              console.log("Dependency audit report unavailable; see npm audit output above.");
            }
          '

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
