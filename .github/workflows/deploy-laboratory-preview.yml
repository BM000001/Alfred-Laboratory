name: Deploy Alfred Laboratory preview

on:
  push:
    branches: [develop-app]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: laboratory-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund
      - name: Run tests
        run: npm test
      - name: Build laboratory Pages site
        env:
          ALFRED_PAGES_BASE: /Alfred-Laboratory/
        run: npm run build:pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy laboratory preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published laboratory site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --output /tmp/lab-index.html --write-out '%{http_code}' "$SITE_URL" || true)
            if [ "$status" = "200" ] && grep -q 'id="root"' /tmp/lab-index.html; then
              echo "Laboratory preview is available at $SITE_URL"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status"
            sleep 10
          done
          exit 1
