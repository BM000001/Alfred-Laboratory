name: Deploy Alfred Laboratory to GitHub Pages

on:
  push:
    branches: [develop-app]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: laboratory-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build for Laboratory Pages
        env:
          ALFRED_PAGES_BASE: /Alfred-Laboratory/
        run: npm run build:pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site responds
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --output /tmp/alfred-pages.html --write-out '%{http_code}' "$SITE_URL" || true)
            if [ "$status" = "200" ] && grep -q 'id="root"' /tmp/alfred-pages.html; then
              echo "Laboratory Pages responds at $SITE_URL"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status; retrying..."
            sleep 10
          done
          echo "Laboratory Pages did not serve expected index"
          exit 1
