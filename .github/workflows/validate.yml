name: Validate Alfred

on:
  pull_request:
    branches:
      - develop-app
      - develop
      - main
  push:
    branches:
      - develop-app
      - develop

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
