name: Visual learning POC checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'visual-learning-poc/**'
      - '.github/workflows/visual-learning-poc.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd visual-learning-poc && pwd && ls -l package.json package-lock.json && npm ci --no-audit --no-fund
      - name: Unit tests
        run: cd visual-learning-poc && npm test
      - name: Build PWA
        run: cd visual-learning-poc && npm run build
      - name: Install WebKit for browser checks
        run: cd visual-learning-poc && npx playwright install --with-deps webkit
      - name: WebKit interaction and offline checks
        run: cd visual-learning-poc && mkdir -p evidence && npm run test:e2e
      - name: Report bundle size
        run: cd visual-learning-poc && du -ah dist | sort -h | tail -n 20
      - name: Save static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-learning-poc-static-preview
          path: |
            visual-learning-poc/dist/
            visual-learning-poc/evidence/
          if-no-files-found: error
          retention-days: 7
