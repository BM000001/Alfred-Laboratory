name: Visual learning POC checks
on:
  push:
    branches: [research/visual-learning-poc]
    paths:
      - 'visual-learning-poc/**'
      - '.github/workflows/visual-learning-poc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'visual-learning-poc/**'
      - '.github/workflows/visual-learning-poc.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-learning-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build PWA
        run: npm run build
      - name: Install WebKit for browser checks
        run: npx playwright install --with-deps webkit
      - name: WebKit interaction and offline checks
        run: npm run test:e2e
      - name: Report bundle size
        run: du -ah dist | sort -h | tail -n 20
      - name: Save static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-learning-poc-static-preview
          path: visual-learning-poc/dist/
          if-no-files-found: error
          retention-days: 7