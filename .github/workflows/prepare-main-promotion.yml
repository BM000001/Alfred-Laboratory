name: Prepare Laboratory main promotion
on:
  push:
    branches: [chore/promote-laboratory-app-to-main]
permissions:
  contents: write
jobs:
  import-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import application while preserving main documentation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main develop-app
          git checkout origin/develop-app -- .
          git show origin/main:README.md > README.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/deploy-pages.yml")
          s = p.read_text()
          s = s.replace("branches: [develop-app]", "branches: [main]")
          p.write_text(s)
          PY
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to promote"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: import Alfred app for Laboratory main preview"
          git push origin HEAD:chore/promote-laboratory-app-to-main
