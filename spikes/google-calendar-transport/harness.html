<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alfred — teste de transporte Google Apps Script</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    input, button { font: inherit; padding: .7rem; }
    input { width: min(100%, 650px); }
    button { margin: .5rem .25rem .5rem 0; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f3f3; padding: 1rem; border-radius: .5rem; }
    iframe { width: 100%; height: 110px; border: 1px solid #aaa; border-radius: .5rem; }
  </style>
</head>
<body>
  <h1>Teste de transporte Google Apps Script</h1>
  <p>Este teste verifica somente a comunicação entre esta página e o Apps Script. Não consulta nem altera eventos do Google Calendar.</p>
  <label for="webapp">URL do Web App (/exec)</label><br>
  <input id="webapp" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  <div>
    <button id="connect" type="button">Carregar ponte</button>
    <button id="test" type="button" disabled>Testar comunicação</button>
  </div>
  <p id="status" role="status">Aguardando URL do Web App.</p>
  <pre id="result">Nenhum teste executado.</pre>
  <iframe id="bridge" title="Ponte Google Apps Script" hidden></iframe>

  <script>
    (() => {
      'use strict';
      const CHANNEL = 'alfred-google-calendar-transport-spike';
      const VERSION = 1;
      const GOOGLE_ORIGINS = new Set([
        'https://script.google.com',
        'https://script.googleusercontent.com'
      ]);
      const frame = document.getElementById('bridge');
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const connectButton = document.getElementById('connect');
      const testButton = document.getElementById('test');
      let readyOrigin = null;
      let pendingRequestId = null;

      function setStatus(message) {
        status.textContent = message;
      }

      connectButton.addEventListener('click', () => {
        readyOrigin = null;
        pendingRequestId = null;
        testButton.disabled = true;
        result.textContent = 'Aguardando a ponte...';
        let url;
        try {
          url = new URL(document.getElementById('webapp').value.trim());
        } catch {
          setStatus('Informe uma URL válida do Apps Script.');
          return;
        }
        if (url.origin !== 'https://script.google.com' ||
            !/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname)) {
          setStatus('Por segurança, use somente a URL oficial /macros/s/.../exec do Apps Script.');
          return;
        }
        frame.hidden = false;
        frame.src = url.toString();
        setStatus('Ponte carregando. Se o Google pedir login ou autorização, conclua no próprio Google.');
      });

      testButton.addEventListener('click', () => {
        if (!readyOrigin || !frame.contentWindow) return;
        const requestId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
        pendingRequestId = requestId;
        result.textContent = 'Enviando solicitação de teste...';
        frame.contentWindow.postMessage({
          channel: CHANNEL,
          protocolVersion: VERSION,
          type: 'request',
          action: 'health',
          requestId
        }, readyOrigin);
      });

      window.addEventListener('message', (event) => {
        if (event.source !== frame.contentWindow) return;
        if (!GOOGLE_ORIGINS.has(event.origin)) return;
        const message = event.data;
        if (!message || message.channel !== CHANNEL || message.protocolVersion !== VERSION) return;

        if (message.type === 'ready') {
          readyOrigin = event.origin;
          testButton.disabled = false;
          setStatus('Ponte carregada. Execute o teste de comunicação.');
          return;
        }

        if (!pendingRequestId || message.requestId !== pendingRequestId) return;
        pendingRequestId = null;
        if (message.type === 'response') {
          setStatus('Sucesso: a resposta do Apps Script chegou à página Alfred.');
          result.textContent = JSON.stringify(message.response, null, 2);
        } else if (message.type === 'error') {
          setStatus('O Apps Script retornou um erro.');
          result.textContent = String(message.error || 'Erro desconhecido.');
        }
      });
    })();
  </script>
</body>
</html>
