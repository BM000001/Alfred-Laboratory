[features]
multi_agent = true

[agents]
max_threads = 3
max_depth = 1

[agents.explorer]
description = "Explora o código e rastreia fluxos sem editar arquivos."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "Revisa alterações em busca de bugs, riscos e lacunas de validação."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Pesquisa documentação oficial e verifica comportamento de APIs."
config_file = "agents/docs-researcher.toml"
